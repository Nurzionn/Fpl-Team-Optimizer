# Save this file at: .github/workflows/fpl.yml in your repository
name: FPL Optimizer

on:
  schedule:
    # Runs every Friday at 18:00 UTC (adjust to time before deadline)
    - cron: "0 18 * * 5"
  workflow_dispatch: {}  # allows manual runs from GitHub

permissions:
  contents: write  # required for the job to commit/push JSON files

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pulp anthropic

      - name: Run optimizer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FPL_MANAGER_ID: ${{ secrets.FPL_MANAGER_ID }}  # optional: your FPL team ID
        run: python fpl_optimizer.py

      - name: Save result to repository
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add latest_squad.json history.json
          git commit -m "Update optimized squad" || echo "No changes"
          git push
